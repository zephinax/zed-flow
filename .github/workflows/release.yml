name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ^16.0

      - name: Show Swift & Toolchain Info
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Run ZedFlow Test Suite
        run: swift run ZedFlowTests

      - name: Build Universal Release Archive
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh --universal --zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
